<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Overview</title>
  <style>
    :root {
      --bg-primary: #1e1e22;
      --card-bg: rgba(44, 44, 48, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-primary: #f5f5f7;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --accent: #0071e3;
      --accent-glow: rgba(0, 113, 227, 0.35);
      --close-hover: #ff3b30;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background-color: var(--bg-primary);
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      color: var(--text-primary);
      font-family: var(--font);
      margin: 0;
      padding: 32px 40px;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      max-width: 1300px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 0;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.015em;
      color: var(--text-primary);
    }

    .tab-count {
      font-size: 13px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 10px;
      border-radius: 999px;
      font-weight: 500;
    }

    .search-container {
      position: relative;
      width: 320px;
    }

    .search-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
      transition: color 0.2s;
    }

    .search-input {
      width: 100%;
      height: 38px;
      padding: 0 16px 0 38px;
      border: 1px solid var(--card-border);
      border-radius: 999px;
      background-color: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-primary);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-input:focus {
      background-color: rgba(255, 255, 255, 0.14);
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-container:focus-within .search-svg {
      color: var(--text-primary);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1300px;
      padding-bottom: 40px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
      height: 220px;
      cursor: pointer;
      position: relative;
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
    }

    .card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.5);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .card.active-tab {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent), 0 12px 30px var(--accent-glow);
    }

    .card-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background-color: rgba(0, 0, 0, 0.25);
      flex-shrink: 0;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex-grow: 1;
      margin-right: 8px;
    }

    .favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      object-fit: contain;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .close-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.12);
      border: none;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.18s, color 0.18s, transform 0.18s;
      flex-shrink: 0;
      padding: 0;
    }

    .close-btn svg {
      width: 10px;
      height: 10px;
      stroke-width: 2.5;
    }

    .close-btn:hover {
      background-color: var(--close-hover);
      color: #ffffff;
      transform: scale(1.1);
    }

    .preview-container {
      flex-grow: 1;
      background-color: rgba(20, 20, 24, 0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .empty-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-secondary);
      padding: 20px;
      text-align: center;
    }

    .empty-preview-icon {
      width: 36px;
      height: 36px;
      opacity: 0.6;
      border-radius: 8px;
      object-fit: contain;
    }

    .empty-preview-host {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-secondary);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Pestañas</h1>
      <span class="tab-count" id="tab-count">0</span>
    </div>
    <div class="search-container">
      <svg class="search-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" class="search-input" id="search" placeholder="Buscar pestañas…" autocomplete="off">
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <script src="overview.js"></script>
</body>
</html>
