<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Overview</title>
  <style>
    :root {
      --bg-primary: #f5f5f7;
      --card-bg: #ffffff;
      --text-primary: #1d1d1f;
      --text-secondary: #86868b;
      --accent: #0071e3;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1c1c1e;
        --card-bg: #2c2c2e;
        --text-primary: #f5f5f7;
        --text-secondary: #86868b;
        --border: rgba(255, 255, 255, 0.08);
        --shadow: 0 4px 12px rgba(255, 255, 255, 0.1);
      }
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font);
      margin: 0;
      padding: 24px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }

    .search-container {
      position: relative;
      max-width: 320px;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background-color: var(--card-bg);
      color: var(--text-primary);
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 14px;
      pointer-events: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1200px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      height: 200px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
    }

    .card-header {
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background-color: rgba(0, 0, 0, 0.02);
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex-grow: 1;
      margin-right: 8px;
    }

    .favicon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .close-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background-color: rgba(0, 0, 0, 0.05);
      border: none;
      color: var(--text-secondary);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    @media (prefers-color-scheme: dark) {
      .close-btn {
        background-color: rgba(255, 255, 255, 0.1);
      }
    }

    .close-btn:hover {
      background-color: #ff3b30;
      color: white;
    }

    .preview-container {
      flex-grow: 1;
      background-color: var(--bg-primary);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .placeholder {
      color: var(--text-secondary);
      font-size: 11px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tabs</h1>
    <div class="search-container">
      <span class="search-icon">&#128269;</span>
      <input type="text" class="search-input" id="search" placeholder="Search tabs...">
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <script src="overview.js"></script>
</body>
</html>
